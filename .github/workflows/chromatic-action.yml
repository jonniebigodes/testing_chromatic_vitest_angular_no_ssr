name: 'Chromatic Action with Vitest'

on: push

jobs:
  vitest:
    name: Run Vitest
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest tests
        run: npm run test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results-action
          path: .vitest/chromatic
          include-hidden-files: true
          retention-days: 1

  chromatic:
    name: Run Chromatic
    needs: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
      - name:
          Install dependencies
          # ⚠️ See your package manager's documentation for the correct command to install dependencies in a CI environment.
        run: npm ci
      - name: Download Vitest test results
        uses: actions/download-artifact@v8
        with:
          name: test-results-action
          path: .vitest/chromatic
      - name: Display Vitest test results Action
        run: |
          echo "Vitest Test Results Action:"
          ls -la
          echo "Contents of the root directory:"
          ls -la .vitest*
          echo "Contents of .vitest/ directory:"
          cd .vitest
          tree
      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          # ⚠️ Enable Vitest
          vitest: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
